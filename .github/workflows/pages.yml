name: Refresh bio and videos and deploy Pages

on:
  push:
    branches: [main, master]
  schedule:
    # Check daily; the gate below runs scheduled deployments every 48 hours.
    - cron: '23 0 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh Scholar publications, Refresh software list]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check 48-hour interval
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from datetime import datetime, timezone
          # UTC day parity avoids short intervals at month boundaries.
          day = (datetime.now(timezone.utc).date() - datetime(1970, 1, 1).date()).days
          run = os.environ['EVENT_NAME'] != 'schedule' or day % 2 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run={str(run).lower()}\n")
          PYTHON

  deploy:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install biography renderer
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Verify biography synchronization
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh profile biography
        id: bio
        continue-on-error: true
        run: python3 scripts/update_bio.py
      - name: Report unavailable biography
        if: steps.bio.outcome == 'failure'
        run: echo '::warning::Biography refresh failed. Publishing the checked-in biography instead.'
      - name: Refresh latest five videos
        id: refresh
        continue-on-error: true
        run: python3 scripts/update_videos.py
      - name: Report unavailable feed
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::YouTube refresh failed. Publishing the checked-in videos instead.'
      - name: Render saved Scholar publications
        run: python3 scripts/update_publications.py --render-only
      - name: Render saved software list
        run: python3 scripts/update_software.py --render-only
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html 404.html style-diag.css .nojekyll _site/
          cp -R images research teaching repositories videos _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
